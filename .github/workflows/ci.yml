# Jobs: format-check, build-and-test (Catch2 unit tests, then Docker + SQLLogicTest integration tests)
# TODO: Prefer extension-ci-tools
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GEN: ninja

jobs:
  format-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Install tools
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build clang-format-11
          sudo pip3 install cmake-format 'black==24.*' cxxheaderparser pcpp 'clang_format==11.0.1'
      - name: Format check
        run: make format-check

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build cmake libcurl4-openssl-dev libssl-dev g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: iceberg-cpp cache key
        id: iceberg
        run: |
          echo "sha=$(git -C third_party/iceberg-cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "gcc=$(g++-14 -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - name: Restore iceberg-cpp build
        id: iceberg-cache
        uses: actions/cache/restore@v4
        with:
          path: build/release/_iceberg_install
          key: iceberg-${{ runner.os }}-${{ runner.arch }}-gcc${{ steps.iceberg.outputs.gcc }}-release-${{ steps.iceberg.outputs.sha }}
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ccache-build-and-test
          save: true
      - name: Build
        run: make release
      - name: Save iceberg-cpp build
        # Persist across runs even if a later step fails, but only a complete install (stamp present) on a cache miss.
        if: always() && steps.iceberg-cache.outputs.cache-hit != 'true' && hashFiles('build/release/_iceberg_install/.iceberg_stamp') != ''
        uses: actions/cache/save@v4
        with:
          path: build/release/_iceberg_install
          key: iceberg-${{ runner.os }}-${{ runner.arch }}-gcc${{ steps.iceberg.outputs.gcc }}-release-${{ steps.iceberg.outputs.sha }}
      - name: Run unit tests
        run: |
          cmake --build build/release --target proto_iceberg_unittest
          build/release/extension/proto_iceberg/proto_iceberg_unittest
      - name: Start Docker services
        working-directory: test/docker
        run: docker compose up -d
      - name: Wait for REST catalog
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8181/v1/config > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "REST catalog did not become ready"
          docker compose -f test/docker/docker-compose.yml logs
          exit 1
      - name: Wait for RustFS
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:9000/health/ready > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "RustFS did not become ready"
          docker compose -f test/docker/docker-compose.yml logs
          exit 1
      - name: Generate test data
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "pyiceberg[s3fs,pyiceberg-core]==0.11.1" "pyarrow==25.0.0"
          python3 test/scripts/generate_test_data.py
      - name: Run integration tests
        env:
          ICEBERG_SERVER_AVAILABLE: 1
        run: build/release/test/unittest "test/sql/*"
      - name: Docker logs
        if: failure()
        working-directory: test/docker
        run: docker compose logs
      - name: Teardown
        if: always()
        working-directory: test/docker
        run: docker compose down -v
