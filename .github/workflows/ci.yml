name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
      GEN: ninja
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libcurl4-openssl-dev libssl-dev g++-14
      - name: iceberg-cpp cache key
        id: iceberg
        run: |
          echo "key=iceberg-${{ runner.os }}-${{ runner.arch }}-gcc$(g++-14 -dumpfullversion)-release-$(git -C third_party/iceberg-cpp rev-parse HEAD)-${{ hashFiles('cmake/iceberg_cpp.cmake') }}" >> "$GITHUB_OUTPUT"
      - name: Restore iceberg-cpp build
        id: iceberg-cache
        uses: actions/cache/restore@v6
        with:
          path: build/release/_iceberg_install
          key: ${{ steps.iceberg.outputs.key }}
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ccache-build-and-test
          save: true
      - name: Build
        run: make release
      - name: Save iceberg-cpp build
        # Persist across runs even if a later step fails, but only a complete install (stamp present) on a cache miss.
        if: always() && steps.iceberg-cache.outputs.cache-hit != 'true' && hashFiles('build/release/_iceberg_install/.iceberg_stamp') != ''
        uses: actions/cache/save@v6
        with:
          path: build/release/_iceberg_install
          key: ${{ steps.iceberg.outputs.key }}
      - name: Unit tests
        run: make unittest_release
      - name: Install test data dependencies
        run: python3 -m pip install -r test/scripts/requirements.txt
      - name: Integration tests
        run: make integration_test_release
